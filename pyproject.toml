[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = [
  "train_smoke: runs the optional Ultralytics mini training smoke test",
  "external_model: downloads and runs the optional ISWDS ONNX model smoke test",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["backend/app", "backend/tests"]
extend-exclude = [
  "frontend",
  "prepared_sewer_dataset",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
